name: PR Review

# Auto-review every PR with two layers:
#   1. core-checks   — deterministic :core gate (tests + purity). Always runs, no secret needed.
#   2. claude-review — LLM review by the pr-reviewer agent. Runs only if ANTHROPIC_API_KEY is set,
#                      and skips gracefully (green) otherwise.
#
# Enable the LLM review by adding the secret once:
#   gh secret set ANTHROPIC_API_KEY --body "<your anthropic api key>"
# (or repo Settings -> Secrets and variables -> Actions). Criteria live in
# .claude/agents/pr-reviewer.md so the bot and a human reviewer judge by the same rubric.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  core-checks:
    name: ":core gate (tests + purity)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # No ANDROID_HOME in CI -> settings.gradle.kts excludes :app, so :core:test runs with only a JDK.
      - name: ":core tests + purity (bundled core-build-test script)"
        run: bash .claude/skills/core-build-test/scripts/core-test.sh

  claude-review:
    name: "LLM review (pr-reviewer)"
    runs-on: ubuntu-latest
    steps:
      - name: Check for ANTHROPIC_API_KEY
        id: secret
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not set — skipping LLM review. The :core gate still ran. Add the secret to enable pr-reviewer."
          fi

      - name: Checkout PR
        if: steps.secret.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: pr-reviewer
        if: steps.secret.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the **pr-reviewer** for the Health Trainer project. First read
            `.claude/agents/pr-reviewer.md` (your evaluation criteria) and, as needed,
            `.claude/skills/health-trainer-conventions/SKILL.md` and
            `.claude/skills/pose-rule-authoring/SKILL.md`. Then review THIS PR's diff (`gh pr diff`).

            Judge whether anything is "weird" for this project, focusing on:
            - :core purity — no android/androidx/MediaPipe imports under core/ (would break JDK-only tests)
            - TDD — new :core domain logic has accompanying tests
            - rule<->tracker contract — rep validity via aggregateRep ONLY (never by OR-ing per-frame
              hardFailures, which bypasses ratio gates); thresholds in each rule's companion object
              matching docs/plan.md; ratio denominators = visible (evaluated) frames
            - :app honesty — depends on :core only (no domain reimplementation); device-only code marked
              `// requires device`; :app not building on SDK-less CI is expected, not a defect
            - correctness bugs, contract/type-shape mismatches

            Post a concise top-level summary via `gh pr comment` ending with a one-line VERDICT
            (LGTM / comments / blocker). Use inline comments for specific issues. Signal over noise —
            don't nitpick style. Only post GitHub comments; don't reply as chat messages.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
