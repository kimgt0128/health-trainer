name: PR Review

# Auto-review every PR with two layers:
#   1. core-checks  — deterministic :core gate (tests + purity). Always runs, no secret needed.
#   2. codex-review — LLM review by the pr-reviewer agent, powered by OpenAI Codex. Runs only if
#                     OPENAI_API_KEY is set, and skips gracefully (green) otherwise.
#
# Enable the LLM review by adding the secret once:
#   gh secret set OPENAI_API_KEY --body "<your openai api key>"
# Criteria live in .claude/agents/pr-reviewer.md so the bot and a human judge by the same rubric.
# Cost note: the OpenAI API bills per token (not free). Reviews are short; set `model:` below to a
# cheaper model if you want to cap cost. The deterministic :core gate needs no key.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  core-checks:
    name: ":core gate (tests + purity)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # No ANDROID_HOME in CI -> settings.gradle.kts excludes :app, so :core:test runs with only a JDK.
      - name: ":core tests + purity (bundled core-build-test script)"
        run: bash .claude/skills/core-build-test/scripts/core-test.sh

  # Gate the Codex jobs on the secret being present, so a repo without OPENAI_API_KEY stays green.
  secret-check:
    name: "Check OPENAI_API_KEY"
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY not set — skipping Codex review. The :core gate still ran. Add the secret to enable it."
          fi

  codex-review:
    name: "Codex LLM review (pr-reviewer)"
    needs: secret-check
    if: needs.secret-check.outputs.present == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      message: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so Codex can diff base...head
      - id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # model: o4-mini   # optional — set a specific/cheaper model; leave empty for Codex's default
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.ref }}   HEAD: ${{ github.event.pull_request.head.ref }}

            You are the **pr-reviewer** for the Health Trainer project. Read `.claude/agents/pr-reviewer.md`
            (your evaluation criteria) and, as needed, `.claude/skills/health-trainer-conventions/SKILL.md`
            and `.claude/skills/pose-rule-authoring/SKILL.md`. Then review ONLY this PR's changes
            (`git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`).

            Judge whether anything is "weird" for this project, focusing on:
            - :core purity — no android/androidx/MediaPipe imports under core/ (would break JDK-only tests)
            - TDD — new :core domain logic has accompanying tests
            - rule<->tracker contract — rep validity via aggregateRep ONLY (never by OR-ing per-frame
              hardFailures, which bypasses ratio gates); thresholds in each rule's companion object
              matching docs/plan.md; ratio denominators = visible (evaluated) frames
            - :app honesty — depends on :core only (no domain reimplementation); device-only code marked
              `// requires device`; :app not building on SDK-less CI is expected, not a defect
            - correctness bugs, contract/type-shape mismatches

            Output ONLY the review text, in Korean (한글), concise. Group findings by severity
            (blocker / should-fix / nit), each with file:line + reason. End with one line:
            **VERDICT: GO / comments / blocker**. Do NOT post anything yourself — your final message is
            captured and posted as the PR comment by the next job.

  post-review:
    name: "Post Codex review comment"
    needs: [secret-check, codex-review]
    if: needs.secret-check.outputs.present == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          REVIEW: ${{ needs.codex-review.outputs.message }}
        with:
          script: |
            const review = process.env.REVIEW || "_(Codex가 리뷰 메시지를 반환하지 않았습니다 — 워크플로의 output 이름을 확인하세요.)_";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "## 🤖 Codex 리뷰 (pr-reviewer 기준)\n\n" + review,
            });
