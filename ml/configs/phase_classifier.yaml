# Movement-phase classifier config (top / bottom / hold / transition).
# Stabilizes rep counting; used as a secondary signal to the rep state machine.
task: phase_classifier
sequence_length: 60
stride: 15            # finer stride: phase transitions are short-lived

labels:
  0: top
  1: bottom
  2: hold
  3: transition

landmarks:
  - left_shoulder
  - right_shoulder
  - left_elbow
  - right_elbow
  - left_wrist
  - right_wrist
  - left_hip
  - right_hip
  - left_knee
  - right_knee
  - left_ankle
  - right_ankle

per_landmark_features: [x, y, z, visibility]

angle_features:
  - left_knee_angle
  - right_knee_angle
  - left_elbow_angle
  - right_elbow_angle
  - body_line_angle

normalization:
  center: hip_center
  scale: shoulder_width

model:
  baseline: random_forest
  sequence: lstm
  integration_min_macro_f1: 0.75 # docs/colab-drive-workflow.md Integration Decision Rule
